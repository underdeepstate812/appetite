# SPA-роутинг: любой путь (кроме реального файла) отдаёт index.html, чтобы
# react-router-dom мог сам разобрать /offers, /orders и т.д. при прямом заходе/рефреше.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
