name: Demo (GitHub Pages)

# Автономное демо: сайт покупателя, кабинет бизнеса и мобильная версия на встроенных данных (packages/demo), без сервера и базы.
on:
  push:
    # Ветку фичи держим в списке, пока PR не влит в main: workflow_dispatch работает только для файла из основной ветки.
    branches: [main, feature/web-shop-map-oneclick]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build demo site
        run: DEMO_BASE="/${{ github.event.repository.name }}" bash scripts/build-demo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
